# prettier-ignore
procs:
  server:
    shell: >-
      cargo run --bin sshweb --
      --listen 127.0.0.1
      --port 2223
  web:
    # 直接跑 vite(绕过 npm → sh → node 的中间层)。vite(node)收到 SIGTERM 会
    # 干净退出并释放 5173(2026-09 实测),故用 SIGTERM 即可、无需 SIGKILL;
    # 旧版经 `npm run dev` 时 SIGTERM 只到最外层 npm/sh,才需要硬杀整树。
    shell: node node_modules/vite/bin/vite.js dev
    stop: SIGTERM
