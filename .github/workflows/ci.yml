name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Frontend type-check (svelte-check)
        run: npm run check

      - name: Build frontend (produces build/ for rust-embed)
        run: npm run build

      # Pin the nightly date so rustfmt reflow rules match the source (fresh
      # `nightly` drifts: a newer rustfmt re-wraps comments differently).
      - name: Install pinned nightly rustfmt
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-18
          components: rustfmt

      - name: Format check (pinned nightly rustfmt)
        run: cargo fmt --check

      - name: Cargo check + test
        run: cargo test --workspace

  package:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend (embedded into binary at compile time)
        run: npm run build

      - name: Install musl static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # Static musl build — deployable to old-glibc machines (documented path).
      - name: Build static musl binary
        run:
          cargo build --release --target x86_64-unknown-linux-musl --bin sshweb

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/sshweb dist/sshweb-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl
          chmod +x dist/sshweb-*
          ls -l dist/

      - name: Smoke test static binary
        run: ./dist/sshweb-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl version

      # The release notes are the annotated tag's message (see 开发记录文档 §三
      # 「发布流程」), so what a release says lives in the tag, not in this file.
      # A lightweight tag has no message: the body is then only the changelog
      # link computed below.
      - name: Release notes from the tag annotation
        run: |
          # actions/checkout leaves a *lightweight* tag ref (it fetches the commit
          # SHA, not the tag object), whose %(contents) is the commit message.
          # Re-fetch the tag by name to get the annotated object.
          git fetch --force --no-recurse-submodules origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          PREV=$(git ls-remote --tags --refs origin \
            | sed 's#.*refs/tags/##' | sort -V \
            | awk -v cur="${GITHUB_REF_NAME}" '$0 == cur { print prev } { prev = $0 }')
          {
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            if [ -n "${PREV}" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${PREV}" "${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md

      # softprops does not refresh the body of a release that already exists
      # (re-pushing a tag updates assets only), so set it explicitly — this is
      # also what makes the run idempotent.
      - name: Make sure the release body matches the tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
