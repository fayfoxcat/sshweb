name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Frontend type-check (svelte-check)
        run: npm run check

      - name: Build frontend (produces build/ for rust-embed)
        run: npm run build

      - name: Install Rust nightly (rustfmt per AGENTS.md)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format check (nightly rustfmt)
        run: cargo +nightly fmt --check

      - name: Cargo check + test
        run: cargo test --workspace

  package:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend (embedded into binary at compile time)
        run: npm run build

      - name: Install musl static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # Static musl build — deployable to old-glibc machines (documented path).
      - name: Build static musl binary
        run: cargo build --release --target x86_64-unknown-linux-musl --bin sshweb

      # Dynamic glibc build — for machines with glibc >= runner's (Ubuntu).
      - name: Build glibc binary
        run: cargo build --release --bin sshweb

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/sshweb dist/sshweb-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl
          cp target/release/sshweb dist/sshweb-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu
          chmod +x dist/sshweb-*
          ls -l dist/

      - name: Smoke test static binary
        run: ./dist/sshweb-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
