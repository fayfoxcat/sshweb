[package]
name = "sshweb-server"
version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
edition = "2021"

# Ship the SPA as a single `./sshweb` binary: the frontend `build/` directory is
# embedded at compile time and served from memory (no `build/` needed at
# runtime). The binary is named `sshweb` (not `sshweb-server`).
[[bin]]
name = "sshweb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aes-gcm.workspace = true
# No `http2`: nothing here ever negotiates h2 — the cleartext listener can't
# (browsers won't speak h2c) and the TLS listener never sets `alpn_protocols`
# (`tls.rs`), so the feature only linked hyper's h2 codec into the binary
# (+670 KB on the stripped musl build, +10% of `.text`). Re-add only together
# with ALPN support.
axum = { version = "0.8.1", features = ["ws"] }
argon2.workspace = true
base64 = "0.21.4"
bytes = { version = "1.5.0", features = ["serde"] }
cfg-if = "1.0.0"
crc32fast = "1.4"
flate2 = "1.0"
ciborium = "0.2.1"
clap.workspace = true
dashmap = "5.5.3"
encoding_rs = "0.8.31"
futures-util = { version = "0.3.28", features = ["sink"] }
openssh-sftp-client.workspace = true
parking_lot = "0.12.1"
pin-project = "1.1.3"
rand.workspace = true
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# PEM parsing for `tls.rs`. Upstream retired the standalone `rustls-pemfile`
# crate (repo archived 2025-08) into `rustls-pki-types::pem`; `std` is what
# gates the file/reader constructors (`CertificateDer::pem_file_iter`, …).
rustls-pki-types = { version = "1", features = ["std"] }
russh = { version = "0.60", default-features = false, features = ["ring", "flate2", "rsa", "async-trait"] }
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
ssh-key = { package = "internal-russh-forked-ssh-key", version = "=0.6.18", features = ["ed25519", "p256", "p384", "p521", "encryption", "ppk", "hazmat-allow-insecure-rsa-keys"] }
sshweb-core.workspace = true
tokio.workspace = true
# `default-features = false` is load-bearing: the default set turns on
# `aws_lc_rs`, which feature-unions with the `ring` above and leaves rustls with
# *two* providers — `CryptoProvider::from_crate_features()` then returns `None`,
# so any `ServerConfig::builder()` panics at runtime. The trimmed set is exactly
# what `tls.rs` installs explicitly. Keeps `aws-lc-sys` (cmake/C toolchain) out
# of the build graph too.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
nix = { version = "0.27.1", features = ["fs", "ioctl", "process", "signal", "term"] }

[dev-dependencies]
# Test builds union features with [dependencies]: the trimmed set above plus
# the test runtime/macros.
tokio = { workspace = true, features = ["test-util"] }
# `ServiceExt::oneshot` — drives a `Router` in-process for route-table tests.
tower = { version = "0.5", features = ["util"] }
